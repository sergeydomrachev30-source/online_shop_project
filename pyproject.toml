[project]
name = "online-shop-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergey",email = "new_day_has_come@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest-cov (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
mypy = [
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
[tool.mypy]
python_version = "3.10"
mypy_path = "."
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
warn_unused_ignores = true